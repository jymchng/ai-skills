# Intentionally insecure Kubernetes manifest for the fixture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      # k8s-privileged: shares the node network namespace
      hostNetwork: true
      containers:
        - name: app
          image: example.invalid/vulnerable-app:latest
          # k8s-privileged: fully privileged container
          securityContext:
            privileged: true
            # k8s-privilege-escalation: escalation permitted, running as root
            allowPrivilegeEscalation: true
            runAsUser: 0
            capabilities:
              # k8s-caps: every capability granted
              add: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          # k8s-hostpath: the node filesystem is mounted into the pod
          hostPath:
            path: /
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all
spec:
  ingress:
    - from:
        # iac-misconfiguration: the policy permits the whole internet
        - ipBlock:
            cidr: 0.0.0.0/0
