AWSTemplateFormatVersion: "2010-09-09"
Description: Orders platform stack.
Resources:
  OrdersBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
  OrdersDb:
    Type: AWS::RDS::DBInstance
    Properties:
      StorageEncrypted: false
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: admin
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
  WebTier:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: web tier
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
